  # =========================================================================
  # vGEP reconstruction quality vs. atlas size
  # =========================================================================
  figure_atlas_size:
    description: "Sensitivity of the vGEP spatial reconstruction to the number of atlas genes: random k-gene atlases drawn from the 24 curated training genes and from the same pool extended with stan, yrt and Tollo, each scored on the fixed 20-gene validation set at the reference cutoff, plus per-gene leave-one-out reconstruction quality"
    output_dir: "fig_atlas_size"
    regenerate_cache: false
    n_workers: 12
    enabled_panels:
      saturation_curves: true
      sampling_check: true
      per_gene_loo: true
    panels:
      sampling_check:
        kind: matplotlib
        description: "Quality vs atlas size, comparing the spread over 50 random atlases with the spread over every atlas of that size (the sizes small enough to enumerate)"
        exports:
          default:
            path: "sampling_check"
        display: false
      saturation_curves:
        kind: matplotlib
        description: "Validation reconstruction quality vs. atlas size; 24 curated genes alone and extended with stan, yrt and Tollo, on one axis"
        exports:
          default:
            path: "saturation_curves"
        display: false
      per_gene_loo:
        kind: matplotlib
        description: "Per-gene leave-one-out reconstruction quality (atlas = other 43 genes)"
        exports:
          default:
            path: "per_gene_loo"
        display: false

  figure_gene_atlas:
    description: "Common-frame gene atlas: archetype -> diagonal rescale (as in the MATLAB pipeline) (xy scaling + translation, no rotation) -> per-box GEP (analyze_labels eulerian) -> per-gene AOA, all on pyanimalprocessing"
    output_dir: "fig_gene_atlas"
    pipeline:
      overwrite: false            # rebuild archetype/grid/GEP/AOA (augments atlas zarrs in place)
      genes: null                 # null = all atlas genes; or a list to restrict
      max_animals_per_gene: null  # null = all; small int for quick tests
      boxsize: [40, 40]
      overlap: 0.5
      render_genes: null          # null = all genes in the cache
    enabled_panels:
      gene_atlas_maps: true
    panels:
      gene_atlas_maps:
        kind: matplotlib
        description: "Per-gene AOA gene-expression maps on the common archetype grid"
        exports:
          default:
            path: "gene_atlas_maps"
        display: false

  figure_neck_archetype_spread:
    description: "What the neck landmark is worth to the atlas: the correlation between the gene atlas built with and without the neck in the fit"
    output_dir: "fig_neck_archetype_spread"
    pipeline:
      overwrite: false            # recompute the projected neck positions
      rebuild_atlases: false      # rebuild both gene atlases (~1 h over 279 animals)
      n_jobs: 4                   # processes for the per-animal rescale + expression measurement
    enabled_panels:
      agreement_by_gene: true
      agreement_distributions: true
      agreement_map: true
      atlas_statistics: true
    panels:
      agreement_map:
        kind: matplotlib
        description: "Per-box agreement of the two atlases over the tissue, with the macrochaetae and the mean neck drawn on top"
        exports:
          default:
            path: "agreement_map"
        display: false
      agreement_by_gene:
        kind: matplotlib
        description: "Each gene's neck effect beside the floor set by rebuilding its map from half the animals"
        exports:
          default:
            path: "agreement_by_gene"
        display: false
      agreement_distributions:
        kind: matplotlib
        description: "The neck effect and the animal-resampling floor as distributions over the genes where both are defined"
        exports:
          default:
            path: "agreement_distributions"
        display: false
      atlas_statistics:
        kind: matplotlib
        description: "Writes every number behind the agreement panels to atlas_statistics.txt (self-managed, renders no figure)"
        display: false
