      cumulative_apoptosis:
        kind: matplotlib
        description: "Cumulative normalized apoptosis (vi vs Tolloi, grid mean)"
      apoptosis_2h_rate:
        kind: matplotlib
        description: "2h average normalized apoptosis rate (vi vs Tolloi, grid mean)"

