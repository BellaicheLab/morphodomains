# Figure Configuration
#
#
# Usage:
#   python scripts/figures/generate.py                  # Run all enabled
#   python scripts/figures/generate.py --figure grn     # Run figure_grn only
#   python scripts/figures/generate.py --list           # List all panels
#
# Panel options:
#   display: true/false  — open interactive viewer (matplotlib plt.show / napari)
#   save: true/false     — write exports to disk (default: true). Set save: false
#                          with display: true to preview without writing files.
#
# ---------------------------------------------------------------------------
# Manuscript Figure Mapping
# ---------------------------------------------------------------------------
#   Fig 1: figure_flow_deformation
#   Fig 2: figure_morphodynamic_domains
#   Fig 3: figure_spatial_transcriptome
#   Fig 4: figure_grn
#   Fig 5: figure_morphodynamics_comparison, figure_apoptosis_compression,
#          figure_delamination_analysis

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # --- Workspace & output ---
  # "__auto__" is resolved at runtime by generate.py to MORPHODOMAINS_DATA
  base_workspace: "__auto__"
  output_base: "${base_workspace}/figures"

  # --- Zarr repositories (movies & averages) ---
  movie_animal_path: "${base_workspace}/data/zarr/210507_vi_pupa1.zarr"
  averages_241002_eulerian: "${base_workspace}/data/zarr/averages_v3/241002_eulerian"
  averages_240920_lagrangian: "${base_workspace}/data/zarr/averages_v3/240920_lagrangian"
  averages_pyap_tolloi: "${base_workspace}/data/zarr/averages_v3/average_tolloi_pyap.zarr"
  averages_pyap_vi: "${base_workspace}/data/zarr/averages_v3/average_vi_pyap.zarr"
  # same store as movie_animal_path: holds the Tollo:GFP ROIs (figure_tollo_gfp)
  ref_zarr_pyap: "${base_workspace}/data/zarr/210507_vi_pupa1.zarr"
  # atlas gene stores + derived common-frame gene atlas (figure_gene_atlas)
  zarr_atlases: "${base_workspace}/data/zarr_atlases/*/*.zarr"
  gene_atlas_base: "${base_workspace}/data/gene_atlas"

  # --- PIV results ---
  results_piv_base: "${base_workspace}/data/piv"

  # --- CSV / tabular data ---
  macrochaete_csv: "${base_workspace}/data/morphology/macrochaete.csv"
  atlas_validation_txt: "${base_workspace}/data/morphology/atlas_validation.txt"

  # --- h5ad / single-cell sequencing ---
  sc_single_cell_h5ad: "${base_workspace}/data/single_cell/all_seurat_annotated_15_APF_wt.h5ad"
  sc_raw_counts_csv: "${base_workspace}/data/single_cell/epi_RNA_counts.csv"
  sc_raw_counts_csv_all_cells: "${base_workspace}/data/single_cell/all_raw_counts.csv"

  # --- GEP results ---
  gep_results_base: "${base_workspace}/data/gep_results"


  # --- Tollo:GFP registered zarr animals ---
  tollo_gfp_15h_zarr: "${base_workspace}/data/tollo_gfp/TolloGFP_15h.zarr"
  tollo_gfp_20h_zarr: "${base_workspace}/data/tollo_gfp/TolloGFP_20h.zarr"
  tollo_gfp_25h_zarr: "${base_workspace}/data/tollo_gfp/TolloGFP_25h.zarr"
  tollo_gfp_28h_zarr: "${base_workspace}/data/tollo_gfp/TolloGFP_28h.zarr"

  # --- GRN / SCENIC resources ---
  scenic_tf_list: "${base_workspace}/data/grn/TF_list.txt"
  grn_adjacency_dir: "${base_workspace}/data/grn/adjacency"

# ---------------------------------------------------------------------------
# Matplotlib Style
# ---------------------------------------------------------------------------
style:
  # Typography — editable SVG text for Illustrator
  svg.fonttype: "none"
  font.family: "sans-serif"
  font.sans-serif: ["Arial"]

  # Bold/italic runs inside a label go through mathtext; point it at Arial so it
  # stays live text rather than DejaVu glyph outlines.
  mathtext.fontset: "custom"
  mathtext.rm: "Arial"
  mathtext.bf: "Arial:bold"
  mathtext.it: "Arial:italic"

  # Resolution
  savefig.dpi: 600
  savefig.transparent: true

  # Font sizes (pt)
  xtick.labelsize: 5
  ytick.labelsize: 5
  axes.labelsize: 6
  axes.titlesize: 9
  figure.titlesize: 9
  legend.fontsize: 5

  # Figure size unit (mm) — all presets derive from this
  unit_mm: 60

  # Named presets: "rows x cols" -> [width_in, height_in]
  figsize_presets:
    "0.5x0.5": [1.18, 1.18]
    "0.5x1": [2.36, 1.18]
    "1x1": [2.36, 2.36]
    "1x2": [4.72, 2.36]
    "1x3": [7.09, 2.36]
    "1x4": [9.45, 2.36]
    "1.5x1.5": [3.54, 3.54]
    "2x1": [2.36, 4.72]
    "2x2": [4.72, 4.72]
    "2x3": [7.09, 4.72]
    "3x1": [2.36, 7.09]
    "3x2": [4.72, 7.09]
    "3x3": [7.09, 7.09]

# ---------------------------------------------------------------------------
# Napari viewer defaults
# ---------------------------------------------------------------------------
napari:
  window_size: [900, 554]
  theme: "light"

# ---------------------------------------------------------------------------
# Quick enable/disable (overrides per-figure 'enabled' keys below)
# ---------------------------------------------------------------------------
enabled_figures:
  figure_flow_deformation: true   # Velocity and deformation tensor maps  [Fig 1]
  figure_morphodynamic_domains: true   # PCA and clustering  [Fig 2]
  figure_spatial_transcriptome: true   # Spatial transcriptome reconstruction  [Fig 3]
  figure_grn: true   # TF specificity and GRN inference  [Fig 4]
  figure_morphodynamics_comparison: true   # Moran / LISA spatial autocorrelation  [Fig 5]
  figure_apoptosis_compression: true   # Lagrangian apoptosis and compression  [Fig 5]
  figure_delamination_analysis: true   # Lagrangian apoptosis (pyanimalprocessing)  [Fig 5]
  figure_tollo_gfp: true               # Tollo:GFP fluorescence with ROIs
  figure_clustering_stability: true    # Clustering stability vs #PCs (consensus)
  figure_clustering_temporal: true     # Clustering robustness to time pooling
  figure_clustering_spatiotemporal: true  # Clustering under space+time contiguity
  figure_atlas_size: true              # vGEP reconstruction vs. atlas size
  figure_gene_atlas: true              # common-frame gene atlas (pyanimalprocessing)
  figure_neck_archetype_spread: true   # neck-landmark atlas agreement

# ---------------------------------------------------------------------------
# Figures
# ---------------------------------------------------------------------------
figures:
