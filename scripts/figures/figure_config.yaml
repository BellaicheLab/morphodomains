    description: "Robustness of the 5-cluster morphogenetic partition to time pooling: the full pipeline run independently on each single 4h window (early 18-22, late 22-26 hAPF) plus the pooled partition, all cut at the reference k=5, with per-period cluster maps, property heatmaps and a pairwise ARI matrix"
