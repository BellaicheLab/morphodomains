  # =========================================================================
  # Spatio-temporal clustering: domains contiguous in space AND time
  # =========================================================================
  figure_clustering_spatiotemporal:
    description: "Ward clustering of (spatial bin, time frame) observations under a connectivity graph carrying both spatial and temporal edges, over the 45 unique 4h windows with centres 19h58-24h03 hAPF, with the pieces of a domain below 3 bins dissolved within each frame: domain movie, stills, per-bin persistence, the modal domain map and the silhouette sweep"
    output_dir: "fig_clustering_spatiotemporal"
    regenerate_cache: false
    # Domains for the space-time cut. The pooled reference it is compared against is
    # always 5, so beyond 5 the extra domains have no reference counterpart.
    n_clusters: 5
    n_stills: 3
    enabled_panels:
      domain_movie: true
      domain_tiff: true
      domain_stills: true
      domain_stills_column: true
      agreement_vs_pooled: true
      agreement_identity: true
      persistence_map: true
      temporal_stability_map: true
      modal_domain_map: true
      silhouette_spacetime: true
    panels:
      silhouette_spacetime:
        kind: matplotlib
        description: "Silhouette score vs number of domains for the space-time cut, before and after removing isolated bins"
        display: false
      agreement_vs_pooled:
        kind: matplotlib
        description: "Bins x time matrix of agreement with the pooled partition, with per-frame ARI"
        display: false
      agreement_identity:
        kind: matplotlib
        description: "Bins x time matrix of domain identity alone, no ARI curve"
        display: false
      domain_movie:
