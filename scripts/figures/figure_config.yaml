  # =========================================================================
  # Spatial transcriptome reconstruction  [Fig 3]
  # =========================================================================
  figure_spatial_transcriptome:
    regenerate_benchmark: false
    benchmark_repeats: 10
    # optimization_grid: "full" runs the full grid/Optuna searches for every
    # method: widened novosparc (s down to 2, epsilon 0.01-0.1), ~58 vGEP
    # cutoffs, 18 perler k values, 150 tangram Optuna trials, and
    # exhaustive cytospace. Full-mode results land in
    # data/gep_results/{novosparc,perler,tangram,cytospace}_output.
    # Set to "test" for a fast smoke run: tiny grids written to separate
    # *_test/ subdirectories so production caches stay intact.
    optimization_grid: "full"
    description: "Spatial transcriptome reconstruction from scRNA-seq using vGEP, benchmarked against Novosparc, PERLER, Tangram and CytoSPACE (GFP reporter atlas, smiFISH/GFP validation)"
    enabled_panels:
      umap_cell_types: true
      marker_genes: true
      atlas_gene_transforms: true
      spatial_transcriptome: true
      validation_correlation_bars: true
      training_correlation_bars: true
      reconstruction_comparison_validation: true
      reconstruction_comparison_training: true
      vgep_vs_atlas_comparisons: true
      reconstruction_timing: true
      cdf_validation: true
      survival_validation: true
      cdf_training: true
      survival_training: true
      cdf_combined: true
      survival_combined: true
      cdf_protein_vs_fish: true
      survival_protein_vs_fish: true

    output_dir: "fig_spatial_transcriptome"
    regenerate_cache: false
    preprocessing:
      run_atlas_generation: true
      run_transform_atlas: true
    outputs:
      correlation_validation:
        enabled: true
        path: "benchmarking/correlation_validation.csv"
        description: "Per-gene Pearson correlations for validation genes (vGEP, Novosparc, PERLER, Tangram, CytoSPACE)"
      correlation_training:
        enabled: true
        path: "benchmarking/correlation_training.csv"
        description: "Per-gene Pearson correlations for training genes (vGEP, Novosparc, PERLER, Tangram, CytoSPACE)"
    panels:
      # --- UMAP panels ---
      umap_cell_types:
        kind: matplotlib
        description: "UMAP coloured by cell type annotation"
        exports:
          default:
            path: "panel_1"
        display: false
      marker_genes:
        kind: matplotlib
        description: "UMAPs of marker gene expression (one per gene)"
        display: false
      # --- Atlas panels ---
      atlas_gene_transforms:
        kind: matplotlib
        description: "Atlas genes with/without projective transform"
        display: false
      # --- Spatial transcriptome ---
      spatial_transcriptome:
        kind: matplotlib
        description: "Additive-blend napari-style spatial transcriptome"
        exports:
          default:
            path: "panel_3"
        display: false
      # --- Benchmark panels ---
      validation_correlation_bars:
        kind: matplotlib
        description: "Bar plot of validation gene correlations: vGEP vs Novosparc, PERLER, Tangram, CytoSPACE"
        exports:
          default:
            path: "benchmarking/panel_4a_validation_corr"
        display: false
      training_correlation_bars:
        kind: matplotlib
        description: "Bar plot of training gene correlations: vGEP vs Novosparc, PERLER, Tangram, CytoSPACE"
        exports:
          default:
            path: "benchmarking/panel_4b_training_corr"
        display: false
      reconstruction_comparison_validation:
        kind: matplotlib
        description: "Spatial reconstruction grid for validation genes"
        exports:
          default:
            path: "benchmarking/reconstruction_comparison_validation"
        display: false
      reconstruction_comparison_training:
        kind: matplotlib
        description: "Spatial reconstruction grid for training genes"
        exports:
          default:
            path: "benchmarking/reconstruction_comparison_training"
        display: false
      vgep_vs_atlas_comparisons:
        kind: matplotlib
        description: "vGEP vs atlas side-by-side for Tollo, ea, spz3, sr"
        save: true
        display: false
      reconstruction_timing:
        kind: matplotlib
        description: "Bar chart comparing single-reconstruction compute time (vGEP, Novosparc, PERLER, Tangram, CytoSPACE)"
        exports:
          default:
            path: "benchmarking/reconstruction_timing"
        display: false
      # --- CDF / Survival panels ---
      cdf_validation:
        kind: matplotlib
        description: "CDF for validation gene correlations"
        exports:
          default:
            path: "benchmarking/cdf_correlation_validation"
        display: false
      survival_validation:
        kind: matplotlib
        description: "Survival plot for validation gene correlations"
        exports:
          default:
            path: "benchmarking/survival_correlation_validation"
        display: false
      cdf_training:
        kind: matplotlib
        description: "CDF for training gene correlations"
        exports:
          default:
            path: "benchmarking/cdf_correlation_training"
        display: false
      survival_training:
        kind: matplotlib
        description: "Survival plot for training gene correlations"
        exports:
          default:
            path: "benchmarking/survival_correlation_training"
        display: false
      cdf_combined:
        kind: matplotlib
        description: "CDF combining validation + training gene correlations"
        exports:
          default:
            path: "benchmarking/cdf_correlation_combined"
        display: false
      survival_combined:
        kind: matplotlib
        description: "Survival combining validation + training gene correlations"
        exports:
          default:
            path: "benchmarking/survival_correlation_combined"
        display: false
      cdf_protein_vs_fish:
        kind: matplotlib
        description: "CDF comparing Protein vs smiFISH validated genes"
        exports:
          default:
            path: "benchmarking/cdf_protein_vs_fish"
        display: false
      survival_protein_vs_fish:
        kind: matplotlib
        description: "Survival comparing Protein vs smiFISH validated genes"
        exports:
          default:
            path: "benchmarking/survival_protein_vs_fish"
        display: false

