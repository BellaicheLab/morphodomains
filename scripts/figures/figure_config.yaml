  # =========================================================================
  # Apoptosis and compression (Lagrangian)  [Fig 5]
  # =========================================================================
  figure_apoptosis_compression:
    description: "Tensor quantity timeseries in LISA-defined ROIs (compression, compression_restrictive, flow), Lagrangian frame"
    enabled_panels:
      plot_instantaneous: true
      plot_cumulative: true
      correlation_mean: true

    output_dir: "fig_apoptosis_compression"
    comparison_cache_dir: "fig_morphodynamics_comparison/cache"

    rois:
      compression:
        indices_key: "indices_moran"
        path: "rates/compression"
      compression_restrictive:
        indices_key: "indices"
        path: "rates/compression_restrictive"
      flow:
        indices_key: "indices_flow"
        path: "rates/flow"

    panels:
      plot_instantaneous:
        kind: matplotlib
        description: "Instantaneous rates for tensor quantities in ROI"
      plot_cumulative:
        kind: matplotlib
        description: "Cumulative rates for tensor quantities in ROI"
      correlation_mean:
        kind: matplotlib
        description: "Apoptosis-compression correlation (per-condition, ROI)"
        exports:
          roi:
            path: "correlations/compression_apoptosis_roi"

  # =========================================================================
  # Delamination analysis: Lagrangian apoptosis quantification  [Fig 5]
  # =========================================================================
  figure_delamination_analysis:
    description: "Cumulative and 2h-average apoptosis rates (vi vs Tollo RNAi) from the pre-generated Lagrangian averaged stores"
    enabled_panels:
      cumulative_apoptosis: true
      apoptosis_2h_rate: true

    output_dir: "fig_delamination_analysis"
    # Input zarr paths resolved from the top-level paths: section
