      - {center: [-21.6, 854.0], radius: 100}
      - {center: [-18.6, 1068.5], radius: 100}
      - {center: [-16.7, 1256.4], radius: 100}
      - {center: [-14.7, 1466.0], radius: 100}
      - {center: [-13.7, 1608.7], radius: 100}
      - {center: [-13.7, 1709.1], radius: 100}
      - {center: [-15.7, 1863.6], radius: 100}
      - {center: [-17.6, 1994.5], radius: 100}
      - {center: [-15.7, 2141.1], radius: 100}
      - {center: [-15.7, 2331.0], radius: 100}
      - {center: [-19.6, 2539.6], radius: 100}
      - {center: [-17.6, 2724.6], radius: 100}
      - {center: [-19.6, 2918.5], radius: 100}
      - {center: [-23.6, 3073.0], radius: 100}
      - {center: [-17.6, 3173.4], radius: 100}
      - {center: [-19.6, 3309.2], radius: 100}
      - {center: [-19.6, 3429.2], radius: 100}
      - {center: [783.9, 2411.5], radius: 100, frames: [52, 53]} # Midline and outlier points, masked for display only
          # Spatial masks: [{center: [y, x], radius: N, frames: [start, end]}]
    pick_masks: false   # Set true to enable interactive mask picker (press 'E' to export)
    panels:
      velocity_profile:
        kind: matplotlib
        description: "Average tissue flow velocity profile"
        exports:
          default:
            path: "velocity_profile"
        display: false
        save: true
      velocity_maps:
