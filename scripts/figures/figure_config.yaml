      cell_shape_trace: true
      cell_shape_anisotropy: true
      apoptosis_rate: true
      deformation_vi: true
      deformation_tolloi: true
      deformation_difference: true
      velocity_vi: true
      velocity_tolloi: true
      velocity_difference: true

