  # =========================================================================
  # Spatial autocorrelation (Moran/LISA)  [Fig 5]
  # =========================================================================
  figure_morphodynamics_comparison:
    description: "Spatial autocorrelation analysis (Moran's I, LISA) of deformation and velocity fields comparing vi (control) vs Toll RNAi"
    enabled_panels:
      moran_statistics: true
      autocorrelation_scatterplot: true
      moran_colorbars: true
      save_lisa_maps: true
      contraction_analysis: true
      velocity_analysis: true
      velocity_amplitude: true
