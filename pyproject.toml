[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphodomains"
version = "0.9.0"
authors = [
    {name = "Adrien Leroy"},
    {name = "Lorette Noiret"},
]
description = "Figure generation framework for the spatial transcriptomics manuscript"
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = {text = "MIT"}

# Companion packages (pyanimalprocessing, vgep) must be
# installed separately in editable mode — see README.md.
dependencies = [
    "anndata",
    "imageio",
    "joblib",
    "jupyterlab",
    "matplotlib",
    "mudata",
    "napari",
    "numpy",
    "pandas",
    "pyyaml",
    "scanpy",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statannotations",
    "tifffile",
    "tqdm",
    "zarr",
]

[project.urls]
"Homepage" = "https://github.com/BellaicheLab/morphodomains"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
docs = [
    "sphinx>=7.0,<9",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "ipython>=8.0",
]

[tool.setuptools]
packages = []
